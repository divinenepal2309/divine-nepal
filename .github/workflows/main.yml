name: DIVINE NEPAL V37 FINAL BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V37
        uses: actions/checkout@v4

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Using Gradle wrapper."
          else
            echo "Using installed Gradle."
          fi

      - name: Verify V37
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

          echo "V37 Android project verified."

      - name: Check AdMob
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "Checking AdMob App ID..."
          grep -R "ca-app-pub-2217341344296752~2494715637" . \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            2>/dev/null || true

          echo "Checking AdMob Ad Unit ID..."
          grep -R "ca-app-pub-2217341344296752/4808898100" . \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            2>/dev/null || true

      - name: Clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Build Release AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew bundleRelease \
              --no-daemon \
              --stacktrace
          else
            gradle bundleRelease \
              --no-daemon \
              --stacktrace
          fi

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK"

      - name: Verify AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          AAB=$(find app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          echo "AAB generated successfully:"
          echo "$AAB"

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: DIVINE-NEPAL-V37-TEST-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: DIVINE-NEPAL-V37-PLAYSTORE-AAB
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: BUILD SUCCESS
        run: |
          echo "=========================================="
          echo "DIVINE NEPAL V37 BUILD SUCCESSFUL"
          echo "=========================================="
          echo "Gallery preparation was skipped."
          echo "Existing gallery/content was preserved."
          echo "V37 APK and Play Store AAB are ready."
