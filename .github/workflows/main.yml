name: DIVINE NEPAL V37 FINAL BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout V37
        uses: actions/checkout@v4

      - name: Verify V37 Project
        shell: bash
        run: |
          set -e

          echo "Checking DIVINE NEPAL V37 project..."

          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/assets/index.html

          echo "V37 project files OK."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check Gradle
        working-directory: android
        shell: bash
        run: |
          set -e
          gradle --version

      - name: Verify existing Gallery
        shell: bash
        run: |
          echo "Checking existing gallery only..."
          echo "NO gallery download or preparation will be performed."

          if [ -d "android/app/src/main/assets/gallery" ]; then
            COUNT=$(find android/app/src/main/assets/gallery \
              -maxdepth 1 \
              -type f \
              | wc -l)

            echo "Existing gallery files: $COUNT"
          else
            echo "Gallery directory is not present."
            echo "Continuing without modifying gallery."
          fi

      - name: Check AdMob IDs
        shell: bash
        run: |
          echo "Checking AdMob App ID..."

          grep -R \
            "ca-app-pub-2217341344296752~2494715637" \
            android/app/src/main \
            2>/dev/null || true

          echo "Checking AdMob Ad Unit ID..."

          grep -R \
            "ca-app-pub-2217341344296752/4808898100" \
            android/app/src/main \
            2>/dev/null || true

      - name: Clean Android Project
        working-directory: android
        run: |
          gradle clean --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build Release AAB
        working-directory: android
        run: |
          gradle bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          echo "$APK"

      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB=$(find android/app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          echo "AAB successfully generated:"
          echo "$AAB"

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: DIVINE-NEPAL-V37-TEST-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: DIVINE-NEPAL-V37-PLAYSTORE-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: BUILD SUCCESS
        run: |
          echo "========================================"
          echo "DIVINE NEPAL V37 BUILD SUCCESSFUL"
          echo "========================================"
          echo "Existing gallery was preserved."
          echo "Gallery download/preparation was NOT run."
          echo "APK and AAB are ready."
