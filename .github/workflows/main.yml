name: DIVINE NEPAL BUILD FIXED

on:
  push:
    branches:
      - main  # यदि master ब्रान्च हो भने 'master' राख्नुहोस्
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # १. रिपोजिटरीमा भएको मुख्य जिप फाइल अनजिप गर्ने
      - name: Extract Project Zip
        run: |
          echo "Extracting the main project zip file..."
          unzip -o "DIVINE_NEPAL_V37_V32_LUDO_SOCIAL_TOP_FINAL.zip" -d extracted_content
          echo "Content of extracted folder:"
          ls -la extracted_content

      # २. अनजिप भएको फोल्डर भित्र पसेर एन्ड्रोइड रूट खोज्ने र बाहिर ल्याउने
      - name: Find and Move Android Root
        run: |
          echo "Searching for build.gradle inside extracted files..."
          # अनजिप भएको ठाउँमा build.gradle कहाँ छ भनेर खोज्छ
          GRADLE_PATH=$(find extracted_content -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$GRADLE_PATH" ]; then
            echo "Error: build.gradle not found anywhere inside the zip file!"
            exit 1
          fi
          
          # प्रोजेक्ट भएको वास्तविक डाइरेक्टरी पत्ता लगाउँछ
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          echo "Android project root found at: $PROJECT_DIR"
          
          # सबै फाइलहरूलाई मुख्य गिटहब रूट डाइरेक्टरीमा सार्छ
          cp -r $PROJECT_DIR/* .
          echo "Files successfully moved to root directory."
          ls -la

      # ३. फाइल मुभ भएपछि रूटमा सही फाइलहरू छन् भनी पक्का गर्ने स्टेप
      - name: Verify Project Structure
        run: |
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "Error: build.gradle still missing from workspace root!"
            exit 1
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Android Project
        run: ./gradlew clean

      # ४. डकुमेन्टमा आधारित पाथ अनुसार एन्ड्रोइड बिल्ड कमाण्ड रन गर्ने
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      # ५. आर्टिफ्याक्ट्स अपलोड (रुटमा फाइल आइसकेकाले सामान्य पाथ काम गर्छ)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Divine-Nepal-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Divine-Nepal-Release-AAB
          path: "**/build/outputs/bundle/release/*.aab"
