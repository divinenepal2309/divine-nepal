name: DIVINE NEPAL BUILD

on:
  push:
    branches:
      - main  # वा तपाईँको मुख्य ब्रランチको नाम (जस्तै: master) हालिहाल्नुहोस्
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # १. यदि रिपोजिटरीमा जिप फाइल छ भने त्यसलाई अनजिप गर्ने र सही फोल्डर लोकेट गर्ने
      - name: Extract Project Zip
        run: |
          echo "Extracting project if zip exists..."
          if [ -f "DIVINE_NEPAL_V37_V32_LUDO_SOCIAL_TOP_FINAL.zip" ]; then
            unzip -o "DIVINE_NEPAL_V37_V32_LUDO_SOCIAL_TOP_FINAL.zip" -d extracted_project
            # यदि जिप भित्र अर्को एउटा फोल्डर छ भने त्यसका फाइलहरू बाहिर ल्याउने
            if [ -d "extracted_project/DIVINE_NEPAL_V37_V32_LUDO_SOCIAL_TOP_FINAL" ]; then
              mv extracted_project/DIVINE_NEPAL_V37_V32_LUDO_SOCIAL_TOP_FINAL/* .
            else
              mv extracted_project/* .
            fi
          fi

      # २. प्रोजेक्ट स्ट्रक्चर र Gradle फाइलहरू चेक गर्ने (तपाईँको जुन स्टेप फेल भएको थियो)
      - name: Verify Project Structure
        run: |
          echo "Checking project files..."
          ls -la
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "Error: build.gradle file not found in root directory!"
            exit 1
          fi

      # ३. Gradle प्रिमिसन सेट गर्ने
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ४. एन्ड्रोइड प्रोजेक्ट क्लिन गर्ने
      - name: Clean Android Project
        run: ./gradlew clean

      # ५. Debug APK बिल्ड गर्ने
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # ६. Release AAB बिल्ड गर्ने
      - name: Build Release AAB
        run: ./gradlew bundleRelease

      # ७. बिल्ड भएका फाइलहरूलाई गिटहब आर्टिफ्याक्ट्समा सेभ गर्ने (डाउनलोड गर्न मिल्ने बनाउन)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Divine-Nepal-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Divine-Nepal-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
