name: DIVINE NEPAL BUILD FIXED FINAL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # १. मुख्य जिप फाइल अनजिप गर्ने
      - name: Extract Project Zip
        run: |
          echo "Extracting the main project zip file..."
          unzip -o "DIVINE_NEPAL_V37_V32_LUDO_SOCIAL_TOP_FINAL.zip" -d extracted_content

      # २. अनजिप भएको ठाउँबाट एन्ड्रोइड रूट खोज्ने र बाहिर ल्याउने
      - name: Find and Move Android Root
        run: |
          echo "Searching for build.gradle inside extracted files..."
          GRADLE_PATH=$(find extracted_content -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$GRADLE_PATH" ]; then
            echo "Error: build.gradle not found anywhere inside the zip file!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          echo "Android project root found at: $PROJECT_DIR"
          
          cp -r $PROJECT_DIR/* .
          echo "Files successfully moved to root directory."

      # ३. प्रोजेक्टमा gradlew फाइल नभएमा आफैँ नयाँ सिर्जना गर्ने (Fix Step)
      - name: Generate Gradle Wrapper if Missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew missing! Generating a new gradle wrapper..."
            gradle wrapper
          else
            echo "gradlew already exists."
          fi

      # ४. एन्ड्रोइड रूट र gradlew दुवै पक्का गर्ने
      - name: Verify Project Structure
        run: |
          ls -la
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "Error: build.gradle still missing from workspace root!"
            exit 1
          fi

      # ५. प्रिमिसन दिने
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ६. प्रोजेक्ट क्लिन र बिल्ड गर्ने
      - name: Clean Android Project
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      # ७. फाइलहरू अपलोड गर्ने
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Divine-Nepal-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Divine-Nepal-Release-AAB
          path: "**/build/outputs/bundle/release/*.aab"
